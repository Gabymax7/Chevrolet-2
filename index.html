<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Chevrolet GPAT</title>
    <style>
        :root {
            --primary: #ecb100;
            --bg-dark: #1e2229;
            --bg-card: #ffffff;
            --text-main: #333333;
            --border-color: #dddddd;
            --error-color: #d32f2f;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            color: var(--text-main);
            padding: 30px 15px;
            margin: 0;
        }

        .calculadora-container {
            background: var(--bg-card);
            max-width: 600px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border-top: 6px solid var(--primary);
        }

        .header {
            background: var(--bg-dark);
            color: #ffffff;
            text-align: center;
            padding: 22px;
        }

        .header h2 { 
            margin: 0; 
            font-size: 24px;
            letter-spacing: 0.5px;
        }

        .form-section {
            padding: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }

        .form-group select, .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fcfcfc;
            transition: border-color 0.3s;
        }

        .form-group select:focus, .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-calcular {
            width: 100%;
            background-color: var(--bg-dark);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn-calcular:hover {
            background-color: #2c323c;
        }

        .btn-whatsapp {
            width: 100%;
            background-color: #25D366;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.3s;
            margin-top: 15px;
        }

        .btn-whatsapp:hover {
            background-color: #1ebe57;
        }

        .resultados {
            background-color: #f9fafc;
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }

        .resultado-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed #ccc;
        }

        .resultado-item:last-child {
            border-bottom: none;
        }

        .resultado-item span {
            font-size: 16px;
            color: #666;
        }

        .resultado-item strong {
            font-size: 20px;
            color: var(--bg-dark);
        }

        .res-highlight strong {
            color: var(--primary);
            font-size: 24px;
        }

        .error-msg {
            color: var(--error-color);
            font-size: 14px;
            margin-top: 5px;
            display: none;
            font-weight: 500;
        }
        
        .info-gastos {
            font-size: 12px;
            color: #888;
            text-align: right;
            display: block;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="calculadora-container">
        <div class="header">
            <h2>Calculadora GPAT Chevrolet</h2>
        </div>

        <div class="form-section">
            <div class="form-group">
                <label for="vehiculo">Vehículo</label>
                <select id="vehiculo" onchange="cargarCampanas()">
                    <option value="">Seleccione un modelo...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="valorVehiculo">Valor del Vehículo ($)</label>
                <input type="number" id="valorVehiculo" placeholder="Ej: 35000000" oninput="resetResultados()">
            </div>

            <div class="form-group">
                <label for="campana">Campaña / Plan</label>
                <select id="campana" onchange="cargarPlazos()" disabled>
                    <option value="">Seleccione primero el vehículo...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="plazo">Plazo (Cuotas)</label>
                <select id="plazo" onchange="actualizarInfoPlazo()" disabled>
                    <option value="">Seleccione primero el plan...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="montoFinanciar">Monto a Financiar ($)</label>
                <input type="number" id="montoFinanciar" placeholder="Ej: 10000000" oninput="validarMonto()">
                <div id="errorMonto" class="error-msg">El monto supera el límite máximo permitido para este plan.</div>
                <div id="infoMaximo" style="font-size: 13px; color: #555; margin-top: 5px; display: none;"></div>
            </div>

            <button class="btn-calcular" onclick="calcularFinanciacion()">Calcular Cotización</button>
        </div>

        <div class="resultados">
            <div class="resultado-item">
                <span>Gastos Otorgamiento Incluidos:</span>
                <strong id="resGastos">$0,00</strong>
            </div>
            <div class="resultado-item">
                <span>Entrega Requerida:</span>
                <strong id="resEntrega">$0,00</strong>
            </div>
            <div class="resultado-item res-highlight">
                <span>Importe de la Cuota:</span>
                <strong id="resCuota">$0,00</strong>
            </div>
            <span class="info-gastos">*La entrega requerida incluye el anticipo y los gastos de otorgamiento.</span>

            <button class="btn-whatsapp" onclick="enviarWhatsApp()">Enviar por WhatsApp</button>
        </div>
    </div>

    <script>
        const formatMoney = (amount) => {
            return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(amount);
        };

        const gpatData = {
            "Montana": {
                "PLAN PROMOCIONAL MONTANA": [
                    { id: "12_0", plazo: 12, tna: "0,00%", c1000: 83.33, gastos: 0, max: 30000000 },
                    { id: "18_9", plazo: 18, tna: "9,90%", c1000: 61.66, gastos: 0, max: 18000000 },
                    { id: "18_15", plazo: 18, tna: "15,90%", c1000: 65.45, gastos: 0.16, max: 26500000 },
                    { id: "24_18", plazo: 24, tna: "18,90%", c1000: 53.50, gastos: 0, max: 27000000 },
                    { id: "30_23", plazo: 30, tna: "23,90%", c1000: 48.56, gastos: 0, max: 32000000 }
                ],
                "PLAN EXCLUSIVO MONTANA": [
                    { id: "18_0", plazo: 18, tna: "0,00%", c1000: 55.56, gastos: 0.16, max: 25000000 } // Datos estimados por corte de PDF, ajustar si es necesario
                ]
            },
            "Onix / Prisma": {
                "PLAN PROMOCIONAL ONIX": [
                    { id: "12_0", plazo: 12, tna: "0,00%", c1000: 83.33, gastos: 0.16, max: 25000000 },
                    { id: "18_9", plazo: 18, tna: "9,90%", c1000: 61.66, gastos: 0, max: 18000000 },
                    { id: "18_15", plazo: 18, tna: "15,90%", c1000: 65.45, gastos: 0, max: 26500000 },
                    { id: "24_20", plazo: 24, tna: "20,90%", c1000: 54.80, gastos: 0.15, max: 20000000 },
                    { id: "30_24", plazo: 30, tna: "24,90%", c1000: 49.23, gastos: 0, max: 22000000 },
                    { id: "36_24", plazo: 36, tna: "24,90%", c1000: 43.83, gastos: 0, max: 24000000 }
                ]
            },
            "S10 CD LTZ y HC": {
                "PLAN S10 CD LTZ y HC": [
                    { id: "12_0", plazo: 12, tna: "0,00%", c1000: 83.33, gastos: 0.15, max: 35000000 },
                    { id: "18_19", plazo: 18, tna: "19,90%", c1000: 68.02, gastos: 0.15, max: 40000000 },
                    { id: "24_19", plazo: 24, tna: "19,90%", c1000: 54.15, gastos: 0, max: 27500000 },
                    { id: "30_25", plazo: 30, tna: "25,90%", c1000: 49.92, gastos: 0.16, max: 50000000 }
                ],
                "PLAN EXCLUSIVO S10 LTZ Y HC": [
                    { id: "18_0", plazo: 18, tna: "0,00%", c1000: 55.56, gastos: 0.17, max: 30000000 }
                ]
            },
            "S10 WT y Z71": {
                "PLAN PROMOCIONAL S10 WT y Z71": [
                    { id: "12_0", plazo: 12, tna: "0,00%", c1000: 83.33, gastos: 0, max: 30000000 },
                    { id: "18_19", plazo: 18, tna: "19,90%", c1000: 68.02, gastos: 0.15, max: 40000000 },
                    { id: "24_19", plazo: 24, tna: "19,90%", c1000: 54.15, gastos: 0.15, max: 27500000 },
                    { id: "30_25", plazo: 30, tna: "25,90%", c1000: 49.92, gastos: 0, max: 30000000 }
                ],
                "PLAN EXCLUSIVO S10 WT y Z71": [
                    { id: "18_0", plazo: 18, tna: "0,00%", c1000: 55.56, gastos: 0.17, max: 30000000 }
                ]
            },
            "Sonic": {
                "PLAN EXCLUSIVO SONIC": [
                    { id: "12_0", plazo: 12, tna: "0,00%", c1000: 83.33, gastos: 0, max: 28000000 },
                    { id: "18_0", plazo: 18, tna: "0,00%", c1000: 55.56, gastos: 0.16, max: 25000000 },
                    { id: "24_0", plazo: 24, tna: "0,00%", c1000: 41.67, gastos: 0, max: 22000000 }
                ]
            },
            "Spin": {
                "PLAN PROMOCIONAL SPIN": [
                    { id: "12_0", plazo: 12, tna: "0,00%", c1000: 83.33, gastos: 0.16, max: 24000000 },
                    { id: "18_9", plazo: 18, tna: "9,90%", c1000: 61.66, gastos: 0, max: 18000000 },
                    { id: "18_15", plazo: 18, tna: "15,90%", c1000: 65.45, gastos: 0, max: 26500000 },
                    { id: "24_20", plazo: 24, tna: "20,90%", c1000: 54.80, gastos: 0.15, max: 20000000 },
                    { id: "30_24", plazo: 30, tna: "24,90%", c1000: 49.23, gastos: 0, max: 25000000 }
                ]
            },
            "Tracker": {
                "PLAN TRACKER": [
                    { id: "12_0", plazo: 12, tna: "0,00%", c1000: 83.33, gastos: 0.16, max: 27000000 },
                    { id: "18_9", plazo: 18, tna: "9,90%", c1000: 61.66, gastos: 0, max: 18000000 },
                    { id: "18_15", plazo: 18, tna: "15,90%", c1000: 65.45, gastos: 0, max: 26500000 },
                    { id: "24_20", plazo: 24, tna: "20,90%", c1000: 54.80, gastos: 0.15, max: 20000000 },
                    { id: "30_24", plazo: 30, tna: "24,90%", c1000: 49.23, gastos: 0, max: 22000000 },
                    { id: "36_22", plazo: 36, tna: "22,90%", c1000: 42.45, gastos: 0, max: 32000000 }
                ]
            },
            "Trailblazer / Silverado": {
                "PLAN TRAILBLAZER": [
                    { id: "12_0", plazo: 12, tna: "0,00%", c1000: 83.33, gastos: 0, max: 43000000 },
                    { id: "18_19", plazo: 18, tna: "19,90%", c1000: 68.02, gastos: 0.15, max: 40000000 },
                    { id: "24_19", plazo: 24, tna: "19,90%", c1000: 54.15, gastos: 0, max: 27500000 },
                    { id: "30_25", plazo: 30, tna: "25,90%", c1000: 49.92, gastos: 0.16, max: 50000000 }
                ],
                "EXCLUSIVO TRAILBLAZER": [
                    { id: "18_0", plazo: 18, tna: "0,00%", c1000: 55.56, gastos: 0, max: 43000000 }
                ]
            },
            "Spark EUV": {
                "PLAN SPARK EUV": [
                    { id: "12_0", plazo: 12, tna: "0,00%", c1000: 83.33, gastos: 0, max: 15000000 },
                    { id: "18_14", plazo: 18, tna: "14,90%", c1000: 64.81, gastos: 0, max: 18000000 },
                    { id: "18_19", plazo: 18, tna: "19,90%", c1000: 68.02, gastos: 0.15, max: 30000000 },
                    { id: "24_25", plazo: 24, tna: "25,90%", c1000: 58.12, gastos: 0, max: 25000000 },
                    { id: "30_29", plazo: 30, tna: "29,90%", c1000: 52.67, gastos: 0, max: 30000000 }
                ]
            },
            "Captiva PHEV": {
                "PLAN CAPTIVA PHEV": [
                    { id: "12_0", plazo: 12, tna: "0,00%", c1000: 83.33, gastos: 0.15, max: 30000000 }
                ]
            }
        };

        // Inicializar Vehículos
        window.onload = function() {
            const selectVehiculo = document.getElementById("vehiculo");
            for (let v in gpatData) {
                let option = document.createElement("option");
                option.value = v;
                option.text = v;
                selectVehiculo.add(option);
            }
        };

        function cargarCampanas() {
            const v = document.getElementById("vehiculo").value;
            const selectCampana = document.getElementById("campana");
            const selectPlazo = document.getElementById("plazo");
            
            selectCampana.innerHTML = '<option value="">Seleccione un plan...</option>';
            selectPlazo.innerHTML = '<option value="">Seleccione primero el plan...</option>';
            selectCampana.disabled = true;
            selectPlazo.disabled = true;
            document.getElementById("infoMaximo").style.display = 'none';
            resetResultados();

            if (v) {
                for (let c in gpatData[v]) {
                    let option = document.createElement("option");
                    option.value = c;
                    option.text = c;
                    selectCampana.add(option);
                }
                selectCampana.disabled = false;
            }
        }

        function cargarPlazos() {
            const v = document.getElementById("vehiculo").value;
            const c = document.getElementById("campana").value;
            const selectPlazo = document.getElementById("plazo");
            
            selectPlazo.innerHTML = '<option value="">Seleccione cuotas...</option>';
            selectPlazo.disabled = true;
            document.getElementById("infoMaximo").style.display = 'none';
            resetResultados();

            if (v && c) {
                gpatData[v][c].forEach(p => {
                    let option = document.createElement("option");
                    option.value = p.id;
                    option.text = `${p.plazo} Meses (TNA ${p.tna})`;
                    selectPlazo.add(option);
                });
                selectPlazo.disabled = false;
            }
        }

        function obtenerPlazoObj() {
            const v = document.getElementById("vehiculo").value;
            const c = document.getElementById("campana").value;
            const pid = document.getElementById("plazo").value;
            if (v && c && pid) {
                return gpatData[v][c].find(item => item.id === pid);
            }
            return null;
        }

        function actualizarInfoPlazo() {
            const obj = obtenerPlazoObj();
            const divInfo = document.getElementById("infoMaximo");
            resetResultados();
            validarMonto();
            
            if (obj) {
                divInfo.innerHTML = `Límite a financiar: <b>${formatMoney(obj.max)}</b>`;
                divInfo.style.display = 'block';
            } else {
                divInfo.style.display = 'none';
            }
        }

        function validarMonto() {
            const montoFinanciar = parseFloat(document.getElementById("montoFinanciar").value) || 0;
            const obj = obtenerPlazoObj();
            const errorMsg = document.getElementById("errorMonto");

            if (obj && montoFinanciar > obj.max) {
                errorMsg.style.display = "block";
                return false;
            } else {
                errorMsg.style.display = "none";
                return true;
            }
        }

        function resetResultados() {
            document.getElementById("resGastos").innerText = "$0,00";
            document.getElementById("resEntrega").innerText = "$0,00";
            document.getElementById("resCuota").innerText = "$0,00";
        }

        function calcularFinanciacion() {
            const valorVehiculo = parseFloat(document.getElementById("valorVehiculo").value);
            const montoFinanciar = parseFloat(document.getElementById("montoFinanciar").value);
            const obj = obtenerPlazoObj();

            if (!valorVehiculo || !montoFinanciar || !obj) {
                alert("Por favor, complete todos los campos correctamente.");
                return;
            }

            if (montoFinanciar > valorVehiculo) {
                alert("El monto a financiar no puede ser mayor al valor del vehículo.");
                return;
            }

            if (!validarMonto()) {
                alert("Reduzca el monto a financiar. Supera el límite de la campaña seleccionada.");
                return;
            }

            // Cálculos
            const cuota = (montoFinanciar / 1000) * obj.c1000;
            const montoGastos = montoFinanciar * obj.gastos;
            const entregaRequerida = (valorVehiculo - montoFinanciar) + montoGastos;

            document.getElementById("resGastos").innerText = formatMoney(montoGastos);
            document.getElementById("resEntrega").innerText = formatMoney(entregaRequerida);
            document.getElementById("resCuota").innerText = formatMoney(cuota);
        }

        function enviarWhatsApp() {
            const vehiculo = document.getElementById("vehiculo").value;
            const campana = document.getElementById("campana").value;
            const selectP = document.getElementById("plazo");
            const plazoTexto = selectP.options[selectP.selectedIndex] ? selectP.options[selectP.selectedIndex].text : "";
            
            const entrega = document.getElementById("resEntrega").innerText;
            const cuota = document.getElementById("resCuota").innerText;
            const valor = document.getElementById("valorVehiculo").value;
            const capital = document.getElementById("montoFinanciar").value;
            
            if (!vehiculo || !campana || selectP.value === "" || entrega === "$0,00" || cuota === "$0,00") {
                alert("Por favor, complete todos los campos y realice un cálculo antes de enviar.");
                return;
            }
            
            const mensaje = `*Cotización Chevrolet GPAT*\n\n` +
                            `🚗 *Vehículo:* ${vehiculo}\n` +
                            `💵 *Valor Unidad:* ${formatMoney(valor)}\n` +
                            `📋 *Plan:* ${campana} (${plazoTexto})\n` +
                            `🏦 *Capital a Financiar:* ${formatMoney(capital)}\n\n` +
                            `💰 *Entrega Requerida:* ${entrega}\n` +
                            `📉 *Importe de la Cuota:* ${cuota}`;
                            
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
